openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Homium Compliance Portal API — templates, versions, saved sections, applications
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: template-library
    description: Template families, versions, lifecycle
  - name: template-editor
    description: Reading and saving a single template version
  - name: saved-sections
    description: Reusable section fragments (copies on insert)
  - name: intake
    description: Applications filling a pinned template version
  - name: intake-uploads
    description: Document uploads per application block
  - name: users
    description: Demo users and the test sign-in check
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /templates:
    get:
      operationId: listTemplates
      tags: [template-library]
      summary: Library index derived from the template files on disk
      responses:
        "200":
          description: All template versions grouped client-side by family
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateListing"
    post:
      operationId: createTemplate
      tags: [template-library]
      summary: Create a new family as a v1 draft (blank scaffold)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: Family already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}:
    get:
      operationId: getTemplate
      tags: [template-editor]
      summary: Full template JSON for one version
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: saveTemplate
      tags: [template-editor]
      summary: Save a draft (active versions are immutable)
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Template"
      responses:
        "200":
          description: Saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Contract validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Version is active and immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/new-version:
    post:
      operationId: createNewVersion
      tags: [template-library]
      summary: Copy vN to v(N+1) as a draft; vN stays active
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "201":
          description: The new draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: A newer version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/duplicate:
    post:
      operationId: duplicateTemplate
      tags: [template-library]
      summary: Copy this version into a brand-new family as v1 draft
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateDuplicateInput"
      responses:
        "201":
          description: New family reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: Target family already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/activate:
    post:
      operationId: activateTemplate
      tags: [template-library]
      summary: Draft to active (one-way); active versions accept applications
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Updated listing row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListing"
        "409":
          description: Already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /saved-sections:
    get:
      operationId: listSavedSections
      tags: [saved-sections]
      summary: Reusable section fragments for the builder palette
      responses:
        "200":
          description: Fragments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSection"
    post:
      operationId: createSavedSection
      tags: [saved-sections]
      summary: Save a section as a reusable fragment (a copy, never a link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSectionInput"
      responses:
        "201":
          description: Saved fragment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSection"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Seeded demo users for the sign-in page
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /login:
    post:
      operationId: login
      tags: [users]
      summary: Validate demo credentials (no session — the client keeps the user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Wrong username or password
  /applications:
    get:
      operationId: listApplications
      tags: [intake]
      summary: All applications with progress summary
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationSummary"
    post:
      operationId: createApplication
      tags: [intake]
      summary: Start an application pinned to an active template version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "409":
          description: Version is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [intake]
      summary: Application with its intake state and pinned template
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateApplication
      tags: [intake]
      summary: Update portal-owned application fields
      description: >
        projectedClosingDate is a first-class portal-owned field (analyzer spec §8) — the
        hard-expiry clocks are judged against it. Null clears it.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/template-version:
    post:
      operationId: upgradeTemplateVersion
      tags: [intake]
      summary: Re-pin the application to a newer active template version
      description: >
        Additive-only upgrade of the application's pinned template copy. The target must be
        a NEWER, ACTIVE version of the same family, and every block on the current pin must
        still exist in the target — uploads, verdicts and analysis mappings key on those
        block ids, so downgrades, re-pins and block-removing moves are refused (409). Each
        successful re-pin appends who/when/vN→vN to templateHistory for the audit trail.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpgradeInput"
      responses:
        "200":
          description: Application re-pinned to the target version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application or template version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Downgrade/re-pin, inactive target, or target removes blocks in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/fields/{blockId}:
    put:
      operationId: saveFieldValues
      tags: [intake]
      summary: Save the values of a field-group block
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValues"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/{applicationId}/uploads/{blockId}:
    post:
      operationId: uploadDocument
      tags: [intake-uploads]
      summary: Upload a file against a document block
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "201":
          description: Stored file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Format not accepted by the block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/uploads/{blockId}/{filename}:
    delete:
      operationId: deleteDocument
      tags: [intake-uploads]
      summary: Remove an uploaded file
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /applications/{applicationId}/analysis:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Analyzer sidecar for an application
      description: Returns an empty shell (latestRunId null, runs []) when no run has been ingested yet.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Sidecar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSidecar"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: ingestAnalysisRun
      tags: [analysis]
      summary: Analyzer write-path — one run object per call
      description: >
        The portal's store appends the run to the sidecar and sets latestRunId itself; the
        analyzer stays stateless toward the portal (single-writer semantics, no
        read-modify-write race). INVARIANT (analyzer spec §5): every documents[].suggestedBlockId
        must resolve to a document block in the application's PINNED template — otherwise the
        whole run is rejected with 400. A runId already present in the sidecar is rejected
        with 409 (idempotent replay protection). The analyzer never mutates the application
        file itself; verdicts stay human-only. Side effect: when the application's packet is
        mid-processing, a successful ingest flips packet.state to report and clears
        lastRunError — the asynchronous completion of the packet choreography.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRun"
      responses:
        "201":
          description: Updated sidecar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSidecar"
        "400":
          description: Unknown suggestedBlockId or invalid run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: runId already ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet:
    post:
      operationId: uploadPacket
      tags: [packet]
      summary: Upload the full document packet; deterministic pre-flight runs immediately
      description: >
        First staged state of the C2 intake flow (analyzer spec §3). Stores the PDF and runs
        the deterministic pre-flight (file validity, page count, metadata snapshot, per-page
        blank/contrast/duplicate/embedded-image-DPI checks — no model calls, no image
        enhancement). Invalid or encrypted PDFs are rejected with 400 and not stored.
        Outcome: state=gated awaiting a human gate decision, or — when the auto rule passes
        (fewer than 20 pages AND zero red flags) — the gate records decision=auto and the
        analyzer is kicked ASYNCHRONOUSLY: the response returns state=processing and the run
        lands later through the ingest endpoint, which flips the state to report. Re-uploading
        replaces the packet and re-runs pre-flight; prior analysis runs remain in the sidecar
        (append-only, latest-run-wins).
        The pre-flight report is stored on the application as audit-trail material. The cost
        estimate covers the FULL pipeline (parse + judge + deep scans) and is staff-facing.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PacketUpload"
      responses:
        "200":
          description: Updated application with packet state (gated, or processing when auto-proceed kicked the analyzer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Not a valid PDF, encrypted, or no file provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: An analyzer run is mid-flight for this packet — re-upload after it lands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Auto-proceed passed but the analyzer could not be reached — packet reverted to gated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/gate:
    post:
      operationId: decidePacketGate
      tags: [packet]
      summary: Decide the pre-flight gate — the gate genuinely blocks
      description: >
        Valid only while packet.state=gated (409 otherwise). decision=confirmed ("Process")
        requires zero red flags; decision=bypassed ("Process anyway") requires at least one —
        the human explicitly overrides the flags. Decision, decider and time are stored for
        the audit trail, then the analyzer worker is kicked ASYNCHRONOUSLY: the response
        returns state=processing and the run lands later through the ingest endpoint (which
        flips the state to report). If the analyzer fails mid-run it calls the run-failed
        callback and the packet reverts to gated with lastRunError set — never a silent hang.
        Nothing proceeds past the gate without this call or the auto rule.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacketGateInput"
      responses:
        "200":
          description: Updated application (state=processing; the run lands via the ingest endpoint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Decision inconsistent with flags (confirmed with flags present, or bypassed without)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Packet is not awaiting a gate decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Analyzer could not be reached — packet reverted to gated, decision not recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/file:
    get:
      operationId: getPacketFile
      tags: [packet]
      summary: The stored packet PDF — the analyzer's input surface
      description: >
        Streams the uploaded packet exactly as stored (no enhancement — "gate, don't
        retouch"). Consumed by the analyzer worker at run start; also lets staff pull the
        original. 404 until a packet has been uploaded.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: The packet PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/run-failed:
    post:
      operationId: reportPacketRunFailure
      tags: [packet]
      summary: Analyzer failure callback — honest revert, never a silent hang
      description: >
        Called by the analyzer worker when a kicked run cannot complete (backend failure,
        timeout, unreadable packet). Guarded flip — only reverts when the packet is still
        processing AND packetSha256 matches, so a stale worker can never clobber a newer
        packet. Reverts state to gated, clears the gate decision, and records lastRunError
        for the staff UI. 409 when the guard does not match (nothing reverted).
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacketRunFailure"
      responses:
        "200":
          description: Packet reverted to gated with lastRunError recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Packet is not processing this sha — nothing reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/thumbnails/{page}:
    get:
      operationId: getPacketThumbnail
      tags: [packet]
      summary: Pre-flight thumbnail PNG (2 worst pages + 1 best, deterministic scores)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: page
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PNG render of the page (low-DPI pre-flight thumbnail)
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid application id or page number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No thumbnail for this page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/verdicts/{blockId}:
    put:
      operationId: recordVerdict
      tags: [analysis]
      summary: Record the human verdict for a document block
      description: >
        Verdicts are human-only (analyzer spec §1.6) — the analyzer suggests, staff decide.
        Accepting a document explicitly confirms document_date/expiry_date, the dates its
        clocks run on (spec §1.4); if the reviewer edited them, datesEdited must be true.
        The latest verdict per block is kept; re-recording replaces it. On accept, staleness
        clocks stop at decidedAt.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerdictInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Not a document block on this application's template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  parameters:
    Family:
      name: family
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ExpiryRule:
      type: object
      description: Null means no clock. staleness uses days; hard means valid through closing.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [staleness, hard]
        days:
          type: integer
    Field:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [text, number, date, select, yesno]
        label: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
    Block:
      type: object
      description: kind=document uses document fields; kind=fields uses the fields array.
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [document, fields]
        id: { type: string }
        name: { type: string }
        docType:
          type: string
          description: >
            Optional analyzer taxonomy id (e.g. bank_statement). With it, classification is
            exact; without it, the analyzer falls back to name-similarity matching
            (analyzer spec §4). Never applicant-facing.
        formats:
          type: array
          items: { type: string }
        requirement:
          type: string
          enum: [required, required_alt, recommended, optional]
        criticality:
          type: string
          enum: [critical, standard, supporting]
        sourcing:
          type: string
          enum: [readily_available, constrained, scarce]
        multiPage: { type: boolean }
        expiry:
          oneOf:
            - $ref: "#/components/schemas/ExpiryRule"
            - type: "null"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    Subsection:
      type: object
      required: [id, name, blocks]
      properties:
        id: { type: string }
        name: { type: string }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
    Permission:
      type: object
      required: [role, view, upload]
      properties:
        role:
          type: string
          enum: [Applicant, Originator, Underwriter, Manager]
        view: { type: boolean }
        upload: { type: boolean }
    Section:
      type: object
      required: [id, name, owner, permissions, subsections]
      properties:
        id: { type: string }
        name: { type: string }
        owner:
          type: string
          enum: [Applicant, Originator, Escrow, Homium]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        subsections:
          type: array
          items:
            $ref: "#/components/schemas/Subsection"
    AlternativeGroup:
      type: object
      description: Satisfied when any one of [primary, ...satisfiedBy] is filed.
      required: [id, name, primary, satisfiedBy]
      properties:
        id: { type: string }
        name: { type: string }
        primary: { type: string }
        satisfiedBy:
          type: array
          items: { type: string }
    Template:
      type: object
      required: [template, version, status, program, alternatives, sections]
      properties:
        template: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [draft, active]
        program: { type: string }
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeGroup"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    TemplateListing:
      type: object
      required: [family, name, program, version, status, sections, docs, updated, inUseBy]
      properties:
        family: { type: string }
        name: { type: string }
        program: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [draft, active]
        sections: { type: integer }
        docs: { type: integer }
        updated: { type: string }
        inUseBy: { type: integer }
    TemplateRef:
      type: object
      required: [family, version]
      properties:
        family: { type: string }
        version: { type: integer }
    TemplateInput:
      type: object
      required: [name, program]
      properties:
        name: { type: string, minLength: 1 }
        program: { type: string, minLength: 1 }
    TemplateDuplicateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    SavedSection:
      type: object
      required: [id, name, source, section]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }
        section:
          $ref: "#/components/schemas/Section"
    SavedSectionInput:
      type: object
      required: [name, source, section]
      properties:
        name: { type: string, minLength: 1 }
        source: { type: string }
        section:
          $ref: "#/components/schemas/Section"
    User:
      type: object
      required: [id, username, name, role, org, initials]
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [Originator, Underwriter, Manager]
        org: { type: string }
        initials: { type: string }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    FieldValues:
      type: object
      description: Map of field id to entered value for one field-group block.
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
    UploadedFile:
      type: object
      required: [filename, size, uploadedAt]
      properties:
        filename: { type: string }
        size: { type: integer }
        uploadedAt: { type: string }
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ApplicationInput:
      type: object
      required: [family, version, applicantName]
      properties:
        family: { type: string }
        version: { type: integer }
        applicantName: { type: string, minLength: 1 }
        projectedClosingDate: { type: string }
    ApplicationUpdate:
      type: object
      properties:
        projectedClosingDate:
          oneOf:
            - type: string
            - type: "null"
    ApplicationSummary:
      type: object
      required: [id, family, version, templateName, applicantName, createdAt, docsFiled, docsTotal]
      properties:
        id: { type: string }
        family: { type: string }
        version: { type: integer }
        templateName: { type: string }
        applicantName: { type: string }
        createdAt: { type: string }
        docsFiled: { type: integer }
        docsTotal: { type: integer }
        projectedClosingDate: { type: string }
    Application:
      type: object
      required: [id, family, version, applicantName, createdAt, fieldValues, uploads, template]
      properties:
        id: { type: string }
        family: { type: string }
        version: { type: integer }
        applicantName: { type: string }
        createdAt: { type: string }
        fieldValues:
          type: object
          description: blockId -> field values map
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        uploads:
          type: object
          description: blockId -> uploaded files
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/UploadedFile"
        projectedClosingDate: { type: string }
        verdicts:
          type: object
          description: blockId -> latest human verdict
          additionalProperties:
            $ref: "#/components/schemas/Verdict"
        packet:
          $ref: "#/components/schemas/PacketState"
        template:
          $ref: "#/components/schemas/Template"
        templateHistory:
          type: array
          description: Audit trail of template re-pins (who, when, vN→vN)
          items:
            $ref: "#/components/schemas/TemplateRepinEvent"
    TemplateUpgradeInput:
      type: object
      required: [targetVersion, decidedBy]
      properties:
        targetVersion: { type: integer }
        decidedBy: { type: string }
    TemplateRepinEvent:
      type: object
      required: [fromVersion, toVersion, decidedBy, decidedAt]
      properties:
        fromVersion: { type: integer }
        toVersion: { type: integer }
        decidedBy: { type: string }
        decidedAt: { type: string }
    Verdict:
      type: object
      description: >
        Human verdict on a document block. Portal-owned; the analyzer never writes these.
        documentDate/expiryDate are the confirmed dates the block's clocks run on.
      required: [verdict, datesEdited, decidedAt, decidedBy]
      properties:
        verdict:
          type: string
          enum: [accepted, new_version_requested]
        note: { type: string }
        documentDate: { type: string }
        expiryDate: { type: string }
        datesEdited: { type: boolean }
        decidedAt: { type: string }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        runId: { type: string }
    VerdictInput:
      type: object
      required: [verdict, decidedBy]
      properties:
        verdict:
          type: string
          enum: [accepted, new_version_requested]
        note: { type: string }
        documentDate: { type: string }
        expiryDate: { type: string }
        datesEdited: { type: boolean }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        runId: { type: string }
    PacketUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    PacketMetadata:
      type: object
      description: >
        Metadata snapshot taken at pre-flight (analyzer spec §2.2). Display-only in v1 —
        metadata ANOMALY detection is analyzer-tier work, not pre-flight.
      properties:
        producer: { type: string }
        creator: { type: string }
        createdAt: { type: string }
        modifiedAt: { type: string }
    PacketThumbnail:
      type: object
      required: [page, reason]
      properties:
        page: { type: integer }
        reason:
          type: string
          description: Why pre-flight picked this page (blank, duplicate, lowest contrast, cleanest).
    PacketPreflight:
      type: object
      description: >
        Deterministic pre-flight report (analyzer spec §3) — no model calls, no image
        enhancement ("gate, don't retouch"). Checks actually run in v1: file validity,
        page count, metadata snapshot, per-page blank detection, per-page contrast,
        exact-duplicate pages, embedded-image DPI. Blur/skew scoring is analyzer-tier and
        intentionally NOT claimed here. Stored on the application as audit-trail material.
      required: [verdict, flags, estimateUsd, estimateMinutes, metadata, thumbnails]
      properties:
        verdict:
          type: string
          description: One plain-language line summarising the packet's pre-flight outcome.
        flags:
          type: array
          description: Plain-language red flags ("p.6 blank", "p.4 duplicate of p.3").
          items: { type: string }
        estimateUsd:
          type: number
          description: >
            FULL-pipeline estimate (parse + judge + deep scans) — informed consent before
            spend; the judge dominates at high page counts. Staff-facing only.
        estimateMinutes: { type: integer }
        metadata:
          $ref: "#/components/schemas/PacketMetadata"
        thumbnails:
          type: array
          description: 2 worst-scoring pages + 1 best, by deterministic per-page scores.
          items:
            $ref: "#/components/schemas/PacketThumbnail"
    PacketGateDecision:
      type: object
      required: [decision, decidedAt]
      properties:
        decision:
          type: string
          enum: [auto, confirmed, bypassed]
        decidedBy:
          type: string
          description: Absent when decision=auto; otherwise the signed-in staff profile.
        decidedAt: { type: string }
    PacketGateInput:
      type: object
      required: [decision, decidedBy]
      properties:
        decision:
          type: string
          enum: [confirmed, bypassed]
        decidedBy: { type: string }
    PacketRunFailure:
      type: object
      required: [reason, packetSha256]
      properties:
        reason: { type: string }
        packetSha256: { type: string }
    PacketState:
      type: object
      description: >
        Portal-owned packet state machine — the staged C2 intake flow: preflight_running →
        gated → processing → report. Persisted server-side so the gate physically blocks;
        no client-side choreography can advance it. Auto rule (spec §3): fewer than 20
        pages AND zero red flags → auto-proceed.
      required: [filename, sizeBytes, pages, sha256, uploadedAt, state]
      properties:
        filename: { type: string }
        sizeBytes: { type: integer }
        pages: { type: integer }
        sha256: { type: string }
        uploadedAt: { type: string }
        state:
          type: string
          enum: [preflight_running, gated, processing, report]
        preflight:
          $ref: "#/components/schemas/PacketPreflight"
        gate:
          $ref: "#/components/schemas/PacketGateDecision"
        lastRunError:
          type: string
          description: >
            Plain-language reason the last analyzer kick failed (packet reverted to gated).
            Cleared by the next successful upload, gate decision, or run ingest.
    AnalysisCoreFields:
      type: object
      description: >
        Universal core fields the judge emits per document (analyzer spec §1.4). Ungrounded
        in v1 — the verdict UI must display the dates for human confirmation at accept.
        Key names follow the analyzer contract verbatim.
      required: [document_date, primary_party_name]
      properties:
        document_date: { type: string }
        expiry_date: { type: string }
        primary_party_name: { type: string }
        issuing_party: { type: string }
    AnalysisSegment:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          description: "[firstPage, lastPage] within the source packet, 1-based inclusive."
          items: { type: integer }
          minItems: 2
          maxItems: 2
    AnalysisScores:
      type: object
      required: [quality, formatting, fraud_signal, scrutinyTier]
      properties:
        quality: { type: number }
        formatting: { type: number }
        fraud_signal: { type: number }
        scrutinyTier:
          type: string
          enum: [critical, standard, supporting]
    AnalysisFlag:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
    AnalysisArtifacts:
      type: object
      description: URLs into the analyzer's artifact store (md + renders + crops).
      required: [md, pageRenders, crops]
      properties:
        md: { type: string }
        pageRenders:
          type: array
          items: { type: string }
        crops:
          type: array
          items: { type: string }
    AnalysisDocument:
      type: object
      required: [segment, suggestedBlockId, confidence, suggestedName, coreFields, scores, flags, extractions, artifacts]
      properties:
        segment:
          $ref: "#/components/schemas/AnalysisSegment"
        suggestedBlockId:
          type: string
          description: Must resolve to a document block in the application's pinned template.
        confidence: { type: number }
        suggestedName:
          type: string
          description: Derived, never hand-written. Human rename always wins and is recorded.
        coreFields:
          $ref: "#/components/schemas/AnalysisCoreFields"
        scores:
          $ref: "#/components/schemas/AnalysisScores"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFlag"
        extractions:
          type: array
          description: Always present — empty in v1, populated in v2 with zero contract change.
          items:
            type: object
            additionalProperties: true
        artifacts:
          $ref: "#/components/schemas/AnalysisArtifacts"
    AnalysisUnassigned:
      type: object
      required: [pages, description]
      properties:
        pages:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        description: { type: string }
    AnalysisPreflight:
      type: object
      required: [pages, flags, gate]
      properties:
        pages: { type: integer }
        flags:
          type: array
          description: Plain-language pre-flight flags ("p.41–43 below 150 DPI").
          items: { type: string }
        gate:
          type: string
          enum: [auto, confirmed, bypassed]
    AnalysisRun:
      type: object
      required: [runId, startedAt, pipelineVersion, preflight, documents, unassigned, whisper]
      properties:
        runId: { type: string }
        startedAt: { type: string }
        pipelineVersion: { type: string }
        preflight:
          $ref: "#/components/schemas/AnalysisPreflight"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisDocument"
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisUnassigned"
        whisper:
          type: array
          items: { type: string }
    AnalysisSidecar:
      type: object
      description: Portal-owned sidecar file (data/analysis/<applicationId>.json). Append-only runs.
      required: [applicationId, latestRunId, runs]
      properties:
        applicationId: { type: string }
        latestRunId:
          oneOf:
            - type: string
            - type: "null"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRun"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Homium Compliance Portal API — templates, versions, saved sections, applications
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: template-library
    description: Template families, versions, lifecycle
  - name: template-editor
    description: Reading and saving a single template version
  - name: saved-sections
    description: Reusable section fragments (copies on insert)
  - name: intake
    description: Applications filling a pinned template version
  - name: intake-uploads
    description: Document uploads per application block
  - name: users
    description: Demo users and the test sign-in check
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /templates:
    get:
      operationId: listTemplates
      tags: [template-library]
      summary: Library index derived from the template files on disk
      responses:
        "200":
          description: All template versions grouped client-side by family
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateListing"
    post:
      operationId: createTemplate
      tags: [template-library]
      summary: Create a new family as a v1 draft (blank scaffold)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: Family already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}:
    get:
      operationId: getTemplate
      tags: [template-editor]
      summary: Full template JSON for one version
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    put:
      operationId: saveTemplate
      tags: [template-editor]
      summary: Save a draft (active versions are immutable)
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Template"
      responses:
        "200":
          description: Saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Contract validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Version is active and immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/new-version:
    post:
      operationId: createNewVersion
      tags: [template-library]
      summary: Copy vN to v(N+1) as a draft; vN stays active
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "201":
          description: The new draft reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: A newer version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/duplicate:
    post:
      operationId: duplicateTemplate
      tags: [template-library]
      summary: Copy this version into a brand-new family as v1 draft
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateDuplicateInput"
      responses:
        "201":
          description: New family reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateRef"
        "409":
          description: Target family already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /templates/{family}/{version}/activate:
    post:
      operationId: activateTemplate
      tags: [template-library]
      summary: Draft to active (one-way); active versions accept applications
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Updated listing row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListing"
        "409":
          description: Already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /saved-sections:
    get:
      operationId: listSavedSections
      tags: [saved-sections]
      summary: Reusable section fragments for the builder palette
      responses:
        "200":
          description: Fragments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSection"
    post:
      operationId: createSavedSection
      tags: [saved-sections]
      summary: Save a section as a reusable fragment (a copy, never a link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSectionInput"
      responses:
        "201":
          description: Saved fragment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSection"
  /variant-shapes:
    get:
      operationId: listVariantShapes
      tags: [variant-shapes]
      summary: Reusable variant shapes (descriptor conventions) for the builder — presets + saved
      responses:
        "200":
          description: Shapes, presets first then saved, each alphabetical
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantShape"
    post:
      operationId: createVariantShape
      tags: [variant-shapes]
      summary: Save the current variant config as a reusable shape (a copy, never a link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantShapeInput"
      responses:
        "201":
          description: Saved shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantShape"
        "409":
          description: A shape with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Seeded demo users for the sign-in page
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /login:
    post:
      operationId: login
      tags: [users]
      summary: Validate demo credentials (no session — the client keeps the user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Wrong username or password
  /applications:
    get:
      operationId: listApplications
      tags: [intake]
      summary: All applications with progress summary
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationSummary"
    post:
      operationId: createApplication
      tags: [intake]
      summary: Start an application pinned to an active template version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "409":
          description: Version is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [intake]
      summary: Application with its intake state and pinned template
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateApplication
      tags: [intake]
      summary: Update portal-owned application fields
      description: >
        projectedClosingDate is a first-class portal-owned field (analyzer spec §8) — the
        hard-expiry clocks are judged against it. Null clears it.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/template-version:
    post:
      operationId: upgradeTemplateVersion
      tags: [intake]
      summary: Re-pin the application to a newer active template version
      description: >
        Additive-only upgrade of the application's pinned template copy. The target must be
        a NEWER, ACTIVE version of the same family, and every block on the current pin must
        still exist in the target — uploads, verdicts and analysis mappings key on those
        block ids, so downgrades, re-pins and block-removing moves are refused (409). Each
        successful re-pin appends who/when/vN→vN to templateHistory for the audit trail.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpgradeInput"
      responses:
        "200":
          description: Application re-pinned to the target version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application or template version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Downgrade/re-pin, inactive target, or target removes blocks in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/fields/{blockId}:
    put:
      operationId: saveFieldValues
      tags: [intake]
      summary: Save the values of a field-group block
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValues"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/{applicationId}/uploads/{blockId}:
    post:
      operationId: uploadDocument
      tags: [intake-uploads]
      summary: Upload a file against a document block
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
        - name: variantId
          in: query
          required: false
          schema:
            type: string
          description: Set blocks — tag the upload to one of the block's variants (400 if unknown).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "201":
          description: Stored file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Format not accepted by the block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/uploads/{blockId}/{filename}:
    delete:
      operationId: deleteDocument
      tags: [intake-uploads]
      summary: Remove an uploaded file
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /applications/{applicationId}/blocks/{blockId}/variants:
    post:
      operationId: addVariant
      tags: [variants]
      summary: Add a variant to a set block on this application
      description: >
        Descriptor keys must match the template block's descriptorFields exactly;
        values non-empty; duplicate descriptor value-sets rejected (409). Label is
        built server-side; the id is minted once.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor]
              properties:
                descriptor:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: The created variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationVariant"
        "400":
          description: Block is not a set block, or descriptor keys/values invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: A variant with the same descriptor already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/blocks/{blockId}/variants/{variantId}:
    delete:
      operationId: deleteVariant
      tags: [variants]
      summary: Remove a variant (refused while uploads are tagged to it)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "409":
          description: Uploads still tagged to this variant — untag or delete them first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/approved-docs:
    get:
      operationId: listApprovedDocs
      tags: [approved-docs]
      summary: The approved-document registry for an application (newest first, superseded rows included)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Registry rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedDocument"
  /applications/{applicationId}/approved-docs/{blockId}/materialize:
    post:
      operationId: materializeApprovedDoc
      tags: [approved-docs]
      summary: Retry approval materialization for an accepted block
      description: >
        Runs the same materialization the accept verdict triggers. Requires an
        accepted verdict on the block. Success clears the block's
        materializationErrors entry; failure updates it — loudly, with the reason.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      responses:
        "201":
          description: The materialized registry row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedDocument"
        "409":
          description: Block has no accepted verdict, or nothing is on file to materialize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Materialization failed (worker or storage) — reason included, recorded on the application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/merge-resolutions:
    post:
      operationId: recordMergeResolution
      tags: [approved-docs]
      summary: Record (or change) the human decision on an analyzer merge recommendation
      description: >
        A merge recommendation (two run groups filed under the same block) must
        be resolved — merged or dismissed — before either group can be approved.
        Upsert keyed by run + the two page ranges; latest decision wins, so a
        dismissed recommendation can be revisited. Portal-owned, additive.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeResolutionInput"
      responses:
        "200":
          description: Updated application (mergeResolutions upserted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid body or ranges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/document-approvals:
    post:
      operationId: recordDocumentApproval
      tags: [approved-docs]
      summary: Record a per-document approval from the filmstrip flow
      description: >
        The document-level confirmation of the page-by-page pre-step — the
        FILING decision (block + variant). approved / approved_incomplete run
        the same materialization seam as block accepts; approved_incomplete
        additionally marks a new version as requested. rejected records the
        decision only. Materialization failure keeps the approval (recorded on
        materializationErrors, retryable) — the decision stands.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentApprovalInput"
      responses:
        "200":
          description: Updated application (documentApprovals prepended; materializationErrors reflects any failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid body, unknown block, or pages outside the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Variant required for a set block, or unknown variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/approved-docs/{approvedDocId}/file:
    get:
      operationId: getApprovedDocFile
      tags: [approved-docs]
      summary: Download an approved document's bytes (pdf) or provenance sidecar (md)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: approvedDocId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [pdf, md]
            default: pdf
      responses:
        "200":
          description: File stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/markdown:
              schema: { type: string }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /models/options:
    get:
      operationId: listModelOptions
      tags: [models]
      summary: Per-stage model options for the run plan
      description: >
        The analyzer worker's model registry, proxied verbatim — per-stage options
        (parse / text / judge) with validation status and live availability (missing
        keys make an option unavailable, never a silent fallback). The dropdowns on the
        gate card render exactly this; the chosen ids travel with the gate decision.
      responses:
        "200":
          description: Stage-by-stage options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelOptionsResponse"
        "502":
          description: Analyzer worker unreachable — options unknown, no guessing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/events:
    get:
      operationId: listApplicationEvents
      tags: [ledger]
      summary: Append-only event ledger for one application
      description: >
        Newest first. Every state change (uploads, gate decisions, verdicts,
        approvals, run ingests, template repins…) writes one row in the same
        transaction as the change. Rows are never updated or deleted.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationEventsResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/analysis:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Analyzer sidecar for an application
      description: Returns an empty shell (latestRunId null, runs []) when no run has been ingested yet.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Sidecar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSidecar"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    post:
      operationId: ingestAnalysisRun
      tags: [analysis]
      summary: Analyzer write-path — one run object per call
      description: >
        The portal's store appends the run to the sidecar and sets latestRunId itself; the
        analyzer stays stateless toward the portal (single-writer semantics, no
        read-modify-write race). INVARIANT (analyzer spec §5): every documents[].suggestedBlockId
        must resolve to a document block in the application's PINNED template — otherwise the
        whole run is rejected with 400. A runId already present in the sidecar is rejected
        with 409 (idempotent replay protection). The analyzer never mutates the application
        file itself; verdicts stay human-only. Side effect: when the application's packet is
        mid-processing, a successful ingest flips packet.state to report and clears
        lastRunError — the asynchronous completion of the packet choreography.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRun"
      responses:
        "201":
          description: Updated sidecar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSidecar"
        "400":
          description: Unknown suggestedBlockId or invalid run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: runId already ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet:
    post:
      operationId: uploadPacket
      tags: [packet]
      summary: Upload the full document packet; deterministic pre-flight runs immediately
      description: >
        First staged state of the C2 intake flow (analyzer spec §3). Stores the PDF and runs
        the deterministic pre-flight (file validity, page count, metadata snapshot, per-page
        blank/contrast/duplicate/embedded-image-DPI checks — no model calls, no image
        enhancement). Invalid or encrypted PDFs are rejected with 400 and not stored.
        Outcome: state=gated awaiting a human gate decision, or — when the auto rule passes
        (fewer than 20 pages AND zero red flags) — the gate records decision=auto and the
        analyzer is kicked ASYNCHRONOUSLY: the response returns state=processing and the run
        lands later through the ingest endpoint, which flips the state to report. Re-uploading
        replaces the packet and re-runs pre-flight; prior analysis runs remain in the sidecar
        (append-only, latest-run-wins).
        The pre-flight report is stored on the application as audit-trail material. The cost
        estimate covers the FULL pipeline (parse + judge + deep scans) and is staff-facing.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PacketUpload"
      responses:
        "200":
          description: Updated application with packet state (gated, or processing when auto-proceed kicked the analyzer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Not a valid PDF, encrypted, or no file provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: An analyzer run is mid-flight for this packet — re-upload after it lands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Auto-proceed passed but the analyzer could not be reached — packet reverted to gated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/files:
    post:
      operationId: uploadPacketFiles
      tags: [packet]
      summary: Multi-file intake — stage several PDFs and get a reviewable manifest
      description: >
        Phase 5 (multi-file intake v1). Accepts up to 25 PDFs in one drop and builds a
        MANIFEST before any analysis: per file — name, size, page count, and the same
        deterministic quality flags pre-flight uses (no model calls). Each file can then be
        removed from the manifest (X) before assembly; assemble concatenates the kept files
        into ONE packet PDF that flows through the existing pre-flight → gate → run pipeline
        unchanged (global page addressing). Re-posting replaces the whole manifest. Refused
        (409) while an analyzer run is mid-flight. Removed = gone at assemble time; there is
        no defer queue in v1 — re-upload later instead.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Application with the new packetManifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: No files, a non-PDF, or an unreadable/encrypted PDF (whole drop rejected — fix and re-drop)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: An analyzer run is mid-flight for this packet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/files/{fileId}:
    post:
      operationId: setPacketFileRemoved
      tags: [packet]
      summary: Toggle a manifest file's removed state (the X — reversible until assemble)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [removed]
              properties:
                removed: { type: boolean }
      responses:
        "200":
          description: Application with the updated manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application, manifest, or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Manifest already assembled or analyzer mid-flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/assemble:
    post:
      operationId: assemblePacket
      tags: [packet]
      summary: Concatenate the kept manifest files into ONE packet and run pre-flight
      description: >
        Assembles the manifest's kept (non-removed) files, in manifest order, into a single
        packet PDF and pushes it through the exact single-packet path (pre-flight, gated
        state, gate decision, analyzer). packet.files records each source file's global page
        span for provenance. At least one kept file required.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application with packet state gated (same shape as uploadPacket)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: No manifest, or every file was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Analyzer mid-flight, staged bytes missing, or a concurrent upload superseded this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/gate:
    post:
      operationId: decidePacketGate
      tags: [packet]
      summary: Decide the pre-flight gate — the gate genuinely blocks
      description: >
        Valid only while packet.state=gated (409 otherwise). decision=confirmed ("Process")
        requires zero red flags; decision=bypassed ("Process anyway") requires at least one —
        the human explicitly overrides the flags. Decision, decider and time are stored for
        the audit trail, then the analyzer worker is kicked ASYNCHRONOUSLY: the response
        returns state=processing and the run lands later through the ingest endpoint (which
        flips the state to report). If the analyzer fails mid-run it calls the run-failed
        callback and the packet reverts to gated with lastRunError set — never a silent hang.
        Nothing proceeds past the gate without this call or the auto rule.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacketGateInput"
      responses:
        "200":
          description: Updated application (state=processing; the run lands via the ingest endpoint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Decision inconsistent with flags (confirmed with flags present, or bypassed without)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Packet is not awaiting a gate decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Analyzer could not be reached — packet reverted to gated, decision not recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/file:
    get:
      operationId: getPacketFile
      tags: [packet]
      summary: The stored packet PDF — the analyzer's input surface
      description: >
        Streams the uploaded packet exactly as stored (no enhancement — "gate, don't
        retouch"). Consumed by the analyzer worker at run start; also lets staff pull the
        original. 404 until a packet has been uploaded.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: The packet PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/run-failed:
    post:
      operationId: reportPacketRunFailure
      tags: [packet]
      summary: Analyzer failure callback — honest revert, never a silent hang
      description: >
        Called by the analyzer worker when a kicked run cannot complete (backend failure,
        timeout, unreadable packet). Guarded flip — only reverts when the packet is still
        processing AND packetSha256 matches, so a stale worker can never clobber a newer
        packet. Reverts state to gated, clears the gate decision, and records lastRunError
        for the staff UI. 409 when the guard does not match (nothing reverted).
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacketRunFailure"
      responses:
        "200":
          description: Packet reverted to gated with lastRunError recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Application or packet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Packet is not processing this sha — nothing reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/packet/thumbnails/{page}:
    get:
      operationId: getPacketThumbnail
      tags: [packet]
      summary: Pre-flight thumbnail PNG (2 worst pages + 1 best, deterministic scores)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: page
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PNG render of the page (low-DPI pre-flight thumbnail)
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid application id or page number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No thumbnail for this page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/verdicts/{blockId}:
    put:
      operationId: recordVerdict
      tags: [analysis]
      summary: Record the human verdict for a document block
      description: >
        Verdicts are human-only (analyzer spec §1.6) — the analyzer suggests, staff decide.
        Accepting a document explicitly confirms document_date/expiry_date, the dates its
        clocks run on (spec §1.4); if the reviewer edited them, datesEdited must be true.
        The latest verdict per block is kept; re-recording replaces it. On accept, staleness
        clocks stop at decidedAt.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/BlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerdictInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Not a document block on this application's template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/runs/{runId}/pages/{page}:
    get:
      operationId: getRunPageImage
      tags: [analysis]
      summary: Full-page PNG render from a landed analyzer run (filmstrip review)
      description: >
        Proxied from the analyzer worker's run store. size=strip returns a cached
        320px-wide thumbnail for the filmstrip; size=full returns the render at
        analyzer DPI. Run artifacts are immutable — responses cache aggressively.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: integer
        - name: size
          in: query
          required: false
          schema:
            type: string
            enum: [full, strip]
      responses:
        "200":
          description: PNG render of the page
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid application id, run id or page number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: No render for this page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Analyzer worker unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /applications/{applicationId}/placements:
    post:
      operationId: recordPlacement
      tags: [analysis]
      summary: Manually file or archive an unassigned page range
      description: >
        Human-only filing for pages the analyzer left unassigned ("your assignments
        win — Sheaf respects manual placement"). target is a document blockId on the
        pinned template, or the literal "archive". A new placement replaces any
        earlier placement that overlaps the same page range. Recorded with
        decidedBy/decidedAt; the analyzer never writes these.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid target block or page range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  parameters:
    Family:
      name: family
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ApplicationEvent:
      type: object
      description: One ledger row — append-only, written with the state change it records.
      required: [seq, at, actor, action]
      properties:
        seq: { type: number }
        at: { type: string }
        actor:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [user, system]
            name: { type: string }
            ip: { type: string }
        action:
          type: string
          description: noun.verb, e.g. file.uploaded, gate.confirmed, verdict.accepted
        target:
          type: object
          required: [type]
          properties:
            type: { type: string }
            id: { type: string }
            label: { type: string }
        detail:
          type: object
          additionalProperties: true
    ListApplicationEventsResponse:
      type: array
      items:
        $ref: "#/components/schemas/ApplicationEvent"
    ExpiryRule:
      type: object
      description: Null means no clock. staleness uses days; hard means valid through closing.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [staleness, hard]
        days:
          type: integer
    Field:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [text, number, date, select, yesno]
        label: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
    Block:
      type: object
      description: kind=document uses document fields; kind=fields uses the fields array.
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [document, fields]
        id: { type: string }
        name: { type: string }
        docType:
          type: string
          description: >
            Optional analyzer taxonomy id (e.g. bank_statement). With it, classification is
            exact; without it, the analyzer falls back to name-similarity matching
            (analyzer spec §4). Never applicant-facing.
        formats:
          type: array
          items: { type: string }
        requirement:
          type: string
          enum: [required, required_alt, recommended, optional]
        criticality:
          type: string
          enum: [critical, standard, supporting]
        sourcing:
          type: string
          enum: [readily_available, constrained, scarce]
        multiPage: { type: boolean }
        expiry:
          oneOf:
            - $ref: "#/components/schemas/ExpiryRule"
            - type: "null"
        arity:
          type: string
          enum: [single, set]
          description: >
            "set" = the requirement is satisfied by N variants (bank accounts, persons, …),
            each with its own documents. Absent = "single" (today's behavior).
        variantConfig:
          $ref: "#/components/schemas/VariantConfig"
        analysisNote:
          type: string
          description: >
            Author-written expert guidance for the analyzer's satisfaction pass
            (e.g. "statements must be consecutive; balance carryover should match").
            Never applicant-facing.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    VariantConfig:
      type: object
      description: >
        Shape of a set block's variants. The template declares WHAT identifies a variant
        (descriptor field keys); the application supplies the actual variants per deal.
        Rules are data, never code (no conditional logic in v1).
      required: [variantNoun, descriptorFields, docsPerVariant]
      properties:
        variantNoun:
          type: string
          description: What one variant is called in the UI ("Bank account", "Person").
        descriptorFields:
          type: array
          description: Identity fields a variant must fill, as specific as possible.
          items:
            $ref: "#/components/schemas/DescriptorField"
        docsPerVariant:
          $ref: "#/components/schemas/DocsPerVariant"
    DescriptorField:
      type: object
      required: [key, label]
      properties:
        key: { type: string, description: "stable snake_case key (institution, account_last4, name, dob)" }
        label: { type: string, description: "UI label (\"Institution\", \"Account (last 4)\")" }
    DocsPerVariant:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [single, sequence]
          description: >
            single = exactly one document per variant (birth certificate);
            sequence = one or more documents (statements). One document never
            fails a sequence — counts are guidance, not gates.
        expectedCount:
          type: integer
          minimum: 1
          description: >
            Recommended number of documents per variant — guidance for review
            and the satisfaction pass, NEVER a hard limit or requirement.
            Document recency is governed by the block's existing expiry clock,
            not duplicated here.
        coverage:
          type: string
          enum: [consecutive_months]
          description: optional — the sequence must cover consecutive periods with no gaps.
    Subsection:
      type: object
      required: [id, name, blocks]
      properties:
        id: { type: string }
        name: { type: string }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
    Permission:
      type: object
      required: [role, view, upload]
      properties:
        role:
          type: string
          enum: [Applicant, Originator, Underwriter, Manager]
        view: { type: boolean }
        upload: { type: boolean }
    Section:
      type: object
      required: [id, name, owner, permissions, subsections]
      properties:
        id: { type: string }
        name: { type: string }
        owner:
          type: string
          enum: [Applicant, Originator, Escrow, Homium]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        subsections:
          type: array
          items:
            $ref: "#/components/schemas/Subsection"
    AlternativeGroup:
      type: object
      description: Satisfied when any one of [primary, ...satisfiedBy] is filed.
      required: [id, name, primary, satisfiedBy]
      properties:
        id: { type: string }
        name: { type: string }
        primary: { type: string }
        satisfiedBy:
          type: array
          items: { type: string }
    Template:
      type: object
      required: [template, version, status, program, alternatives, sections]
      properties:
        template: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [draft, active]
        program: { type: string }
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeGroup"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    TemplateListing:
      type: object
      required: [family, name, program, version, status, sections, docs, updated, inUseBy]
      properties:
        family: { type: string }
        name: { type: string }
        program: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [draft, active]
        sections: { type: integer }
        docs: { type: integer }
        updated: { type: string }
        inUseBy: { type: integer }
    TemplateRef:
      type: object
      required: [family, version]
      properties:
        family: { type: string }
        version: { type: integer }
    TemplateInput:
      type: object
      required: [name, program]
      properties:
        name: { type: string, minLength: 1 }
        program: { type: string, minLength: 1 }
    TemplateDuplicateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    SavedSection:
      type: object
      required: [id, name, source, section]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }
        section:
          $ref: "#/components/schemas/Section"
    SavedSectionInput:
      type: object
      required: [name, source, section]
      properties:
        name: { type: string, minLength: 1 }
        source: { type: string }
        section:
          $ref: "#/components/schemas/Section"
    User:
      type: object
      required: [id, username, name, role, org, initials]
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [Originator, Underwriter, Manager]
        org: { type: string }
        initials: { type: string }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    FieldValues:
      type: object
      description: Map of field id to entered value for one field-group block.
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
    UploadedFile:
      type: object
      required: [filename, size, uploadedAt]
      properties:
        filename: { type: string }
        size: { type: integer }
        uploadedAt: { type: string }
        variantId:
          type: string
          description: >
            Set blocks only — which of the block's variants this file belongs to.
            Metadata only; object-store keys are unchanged.
        uploaderIp:
          type: string
          description: audit trail — client IP the upload arrived from
    ApplicationVariant:
      type: object
      description: >
        One real-world instance of a set block's requirement on THIS application
        ("Chase ····1234", "Jane Doe · 1990-04-24"). The template declares the
        descriptor shape; the application holds the actual variants. Id minted
        once, never re-minted — uploads and (later) approvals key on it.
      required: [id, descriptor, label, createdAt]
      properties:
        id: { type: string }
        descriptor:
          type: object
          description: descriptorField key -> value, keys exactly as the template block declares
          additionalProperties:
            type: string
        label: { type: string, description: "server-built display label (descriptor values joined)" }
        createdAt: { type: string }
    VariantShapeInput:
      type: object
      description: >
        A saved descriptor convention: what one variant of a set block looks like
        (noun + identity fields + docs-per-variant default). Copy-on-use — templates
        get their own copy of the fields, never a reference, so editing a shape
        later cannot reach into existing templates.
      required: [name, variantNoun, descriptorFields]
      properties:
        name: { type: string, description: "library display name, unique" }
        variantNoun: { type: string }
        descriptorFields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DescriptorField"
        docsPerVariant:
          $ref: "#/components/schemas/DocsPerVariant"
    VariantShape:
      allOf:
        - $ref: "#/components/schemas/VariantShapeInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            preset:
              type: boolean
              description: seeded built-in (top document types) — shown first in the picker
    ApprovedDocument:
      type: object
      description: >
        One approved, materialized document — the unit of the approved registry.
        Bytes live flat at approved/<applicationId>/<basename>.pdf + .md; this is
        the row that makes them findable. Append-only; re-acceptance supersedes
        (supersededBy), never deletes.
      required: [id, applicationId, blockId, basename, source, approvedBy, approvedAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        blockId: { type: string }
        variantId: { type: string, description: "set blocks — which variant this document belongs to" }
        basename: { type: string, description: "shared basename of the .pdf/.md pair in the approved store" }
        source:
          type: string
          enum: [extract, copy]
          description: extract = pages pulled from the packet PDF; copy = direct intake upload copied whole
        pages:
          type: array
          description: packet page range [first, last] (extract only)
          items: { type: integer }
          minItems: 2
          maxItems: 2
        runId: { type: string, description: "analyzer run the assignment came from (extract only)" }
        pageRanges:
          type: array
          description: >
            When the document was assembled from a human-accepted merge of
            non-adjacent ranges: every [first,last] range extracted, in order.
            `pages` is the envelope. Absent = single contiguous range.
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
        packetSha256: { type: string }
        sourceFilename: { type: string, description: "original upload filename (copy only)" }
        approvedBy: { type: string }
        approvedAt: { type: string }
        supersededBy: { type: string, description: "id of the newer row that replaced this one" }
    PageDecision:
      type: object
      description: A per-page pre-step decision inside the document approval flow.
      required: [page, decision]
      properties:
        page: { type: integer, description: "1-based packet page" }
        decision:
          type: string
          enum: [good, bad, flag_accepted]
          description: >
            good = page fine as-is; bad = page rejected; flag_accepted = page
            accepted despite flags/low scores — the flag stays on the record as
            a low-level note.
        note: { type: string }
    DocumentApproval:
      type: object
      description: >
        A per-DOCUMENT human approval (the filing decision) — the unit between
        page decisions and block verdicts. Tagged to a block and, for set
        blocks, a variant. approved/approved_incomplete materialize into the
        approved registry through the same seam as block accepts;
        approved_incomplete additionally requests a new version. Append-only on
        the application; a re-approval of the same pages supersedes via the
        registry, never deletes.
      required: [id, blockId, runId, pages, outcome, decidedBy, decidedAt]
      properties:
        id: { type: string }
        blockId: { type: string }
        variantId: { type: string, description: "set blocks — which variant this document files into" }
        runId: { type: string, description: "analyzer run whose grouping this approval is based on" }
        pages:
          type: array
          description: inclusive 1-based packet page range [first, last]
          items: { type: integer }
          minItems: 2
          maxItems: 2
        pageDecisions:
          type: array
          items:
            $ref: "#/components/schemas/PageDecision"
        outcome:
          type: string
          enum: [approved, approved_incomplete, rejected]
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        decidedAt: { type: string }
        approvedDocId: { type: string, description: "registry row created by materialization (approved outcomes only)" }
        pageRanges:
          type: array
          description: >
            For a document assembled from a human-accepted merge of
            NON-ADJACENT ranges: every inclusive [first,last] range that makes
            up the document, ascending, non-overlapping. `pages` remains the
            envelope [min,max] for old readers. Absent = single contiguous range.
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
    DocumentApprovalInput:
      type: object
      required: [blockId, runId, pages, outcome, decidedBy]
      properties:
        blockId: { type: string }
        variantId: { type: string }
        runId: { type: string }
        pages:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        pageDecisions:
          type: array
          items:
            $ref: "#/components/schemas/PageDecision"
        outcome:
          type: string
          enum: [approved, approved_incomplete, rejected]
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        pageRanges:
          type: array
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
    MergeResolution:
      type: object
      description: >
        The human decision on an analyzer merge recommendation between two run
        groups. Keyed on the application by "<runId>:p<f>-<l>|p<f>-<l>"
        (ranges sorted by first page). Latest decision wins — reversible.
      required: [runId, ranges, decision, decidedBy, decidedAt]
      properties:
        runId: { type: string }
        ranges:
          type: array
          description: the two inclusive page ranges the recommendation covers
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
          minItems: 2
          maxItems: 2
        decision:
          type: string
          enum: [merged, dismissed]
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        decidedAt: { type: string }
    MergeResolutionInput:
      type: object
      required: [runId, ranges, decision, decidedBy]
      properties:
        runId: { type: string }
        ranges:
          type: array
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
          minItems: 2
          maxItems: 2
        decision:
          type: string
          enum: [merged, dismissed]
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ApplicationInput:
      type: object
      required: [family, version, applicantName]
      properties:
        family: { type: string }
        version: { type: integer }
        applicantName: { type: string, minLength: 1 }
        projectedClosingDate: { type: string }
    ApplicationUpdate:
      type: object
      properties:
        projectedClosingDate:
          oneOf:
            - type: string
            - type: "null"
    ApplicationSummary:
      type: object
      required: [id, family, version, templateName, applicantName, createdAt, docsFiled, docsTotal]
      properties:
        id: { type: string }
        family: { type: string }
        version: { type: integer }
        templateName: { type: string }
        applicantName: { type: string }
        createdAt: { type: string }
        docsFiled: { type: integer }
        docsTotal: { type: integer }
        projectedClosingDate: { type: string }
    Application:
      type: object
      required: [id, family, version, applicantName, createdAt, fieldValues, uploads, template]
      properties:
        id: { type: string }
        family: { type: string }
        version: { type: integer }
        applicantName: { type: string }
        createdAt: { type: string }
        fieldValues:
          type: object
          description: blockId -> field values map
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        uploads:
          type: object
          description: blockId -> uploaded files
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/UploadedFile"
        projectedClosingDate: { type: string }
        verdicts:
          type: object
          description: blockId -> latest human verdict
          additionalProperties:
            $ref: "#/components/schemas/Verdict"
        packet:
          $ref: "#/components/schemas/PacketState"
        packetManifest:
          $ref: "#/components/schemas/PacketManifest"
        template:
          $ref: "#/components/schemas/Template"
        templateHistory:
          type: array
          description: Audit trail of template re-pins (who, when, vN→vN)
          items:
            $ref: "#/components/schemas/TemplateRepinEvent"
        materializationErrors:
          type: object
          description: >
            blockId -> last approval-materialization failure (loud, with reason).
            The verdict stands; the approved registry row is missing until a
            successful retry clears the entry. Portal-owned.
          additionalProperties:
            type: object
            required: [message, at]
            properties:
              message: { type: string }
              at: { type: string }
        documentApprovals:
          type: array
          description: >
            Per-document approvals from the filmstrip flow, append-only, newest
            first. The registry (approved-docs) is the materialized truth; this
            is the decision trail on the application. Portal-owned.
          items:
            $ref: "#/components/schemas/DocumentApproval"
        mergeResolutions:
          type: object
          description: >
            Merge-recommendation decisions, keyed "<runId>:p<f>-<l>|p<f>-<l>".
            A PENDING recommendation (no entry) gates approval of both groups.
            Portal-owned.
          additionalProperties:
            $ref: "#/components/schemas/MergeResolution"
        variants:
          type: object
          description: >
            blockId -> variants of that set block on this application. Intake-side
            data — variants and their uploads are NOT part of the application's
            satisfied requirements until a human accepts.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ApplicationVariant"
        manualPlacements:
          type: array
          description: Human filings of analyzer-unassigned page ranges (portal-owned)
          items:
            $ref: "#/components/schemas/ManualPlacement"
    TemplateUpgradeInput:
      type: object
      required: [targetVersion, decidedBy]
      properties:
        targetVersion: { type: integer }
        decidedBy: { type: string }
    TemplateRepinEvent:
      type: object
      required: [fromVersion, toVersion, decidedBy, decidedAt]
      properties:
        fromVersion: { type: integer }
        toVersion: { type: integer }
        decidedBy: { type: string }
        decidedAt: { type: string }
    Verdict:
      type: object
      description: >
        Human verdict on a document block. Portal-owned; the analyzer never writes these.
        documentDate/expiryDate are the confirmed dates the block's clocks run on.
      required: [verdict, datesEdited, decidedAt, decidedBy]
      properties:
        verdict:
          type: string
          enum: [accepted, new_version_requested]
        note: { type: string }
        documentDate: { type: string }
        expiryDate: { type: string }
        datesEdited: { type: boolean }
        decidedAt: { type: string }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        runId: { type: string }
    VerdictInput:
      type: object
      required: [verdict, decidedBy]
      properties:
        verdict:
          type: string
          enum: [accepted, new_version_requested]
        note: { type: string }
        documentDate: { type: string }
        expiryDate: { type: string }
        datesEdited: { type: boolean }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        runId: { type: string }
    ManualPlacement:
      type: object
      description: >
        A human decision about an unassigned page range: filed into a document block,
        or archived as not-relevant. Waits for the next analyzer run to confirm —
        manual placement always wins over analyzer suggestions.
      required: [pages, target, decidedBy, decidedAt]
      properties:
        pages:
          type: array
          description: inclusive 1-based page range [first, last]
          items:
            type: integer
          minItems: 2
          maxItems: 2
        target:
          type: string
          description: document blockId on the pinned template, or the literal "archive"
        note: { type: string }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        decidedAt: { type: string }
        runId: { type: string }
    PlacementInput:
      type: object
      required: [pages, target, decidedBy]
      properties:
        pages:
          type: array
          description: inclusive 1-based page range [first, last]
          items:
            type: integer
          minItems: 2
          maxItems: 2
        target:
          type: string
          description: document blockId on the pinned template, or the literal "archive"
        note: { type: string }
        decidedBy:
          type: string
          enum: [Originator, Underwriter, Manager]
        runId: { type: string }
    PacketUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    PacketMetadata:
      type: object
      description: >
        Metadata snapshot taken at pre-flight (analyzer spec §2.2). Display-only in v1 —
        metadata ANOMALY detection is analyzer-tier work, not pre-flight.
      properties:
        producer: { type: string }
        creator: { type: string }
        createdAt: { type: string }
        modifiedAt: { type: string }
    PacketThumbnail:
      type: object
      required: [page, reason]
      properties:
        page: { type: integer }
        reason:
          type: string
          description: Why pre-flight picked this page (blank, duplicate, lowest contrast, cleanest).
    PacketPreflight:
      type: object
      description: >
        Deterministic pre-flight report (analyzer spec §3) — no model calls, no image
        enhancement ("gate, don't retouch"). Checks actually run in v1: file validity,
        page count, metadata snapshot, per-page blank detection, per-page contrast,
        exact-duplicate pages, embedded-image DPI. Blur/skew scoring is analyzer-tier and
        intentionally NOT claimed here. Stored on the application as audit-trail material.
      required: [verdict, flags, estimateUsd, estimateMinutes, metadata, thumbnails]
      properties:
        verdict:
          type: string
          description: One plain-language line summarising the packet's pre-flight outcome.
        flags:
          type: array
          description: Plain-language red flags ("p.6 blank", "p.4 duplicate of p.3").
          items: { type: string }
        estimateUsd:
          type: number
          description: >
            FULL-pipeline estimate (parse + judge + deep scans) — informed consent before
            spend; the judge dominates at high page counts. Staff-facing only.
        estimateMinutes: { type: integer }
        metadata:
          $ref: "#/components/schemas/PacketMetadata"
        thumbnails:
          type: array
          description: 2 worst-scoring pages + 1 best, by deterministic per-page scores.
          items:
            $ref: "#/components/schemas/PacketThumbnail"
    PacketGateDecision:
      type: object
      required: [decision, decidedAt]
      properties:
        decision:
          type: string
          enum: [auto, confirmed, bypassed]
        decidedBy:
          type: string
          description: Absent when decision=auto; otherwise the signed-in staff profile.
        decidedAt: { type: string }
    PacketGateInput:
      type: object
      required: [decision, decidedBy]
      properties:
        decision:
          type: string
          enum: [confirmed, bypassed]
        decidedBy: { type: string }
        plan:
          $ref: "#/components/schemas/RunPlan"
    RunPlan:
      type: object
      description: >
        Per-stage model option ids (from GET /models/options) for THIS run. Omitted
        stages use the system default. The worker resolves ids at run start and fails
        loudly on unknown/unavailable options — never a silent engine substitution;
        the resolved plan is frozen into the run's config artifact (pipelineVersion honesty).
      properties:
        parse: { type: string }
        text: { type: string }
        judge: { type: string }
        fraudScoring:
          type: boolean
          description: >
            Per-run addon toggle (default true): score every judged document for
            visual fraud indicators. Off = fraud_signal is ABSENT from this run's
            scores and the UI renders "not scored this run" — never a fake 0.
            Frozen into the run's config artifact like the engine ids.
    ModelOption:
      type: object
      required: [id, label, status, available, default]
      properties:
        id: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [validated, experimental]
        note: { type: string }
        available: { type: boolean }
        unavailableReason: { type: string }
        default: { type: boolean }
    ModelStageOptions:
      type: object
      required: [stage, locked, options]
      properties:
        stage:
          type: string
          enum: [parse, text, judge]
        locked:
          type: boolean
          description: Locked stages render but cannot be changed (judge in v1, spec §1.2).
        options:
          type: array
          items:
            $ref: "#/components/schemas/ModelOption"
    ModelOptionsResponse:
      type: object
      required: [stages]
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ModelStageOptions"
    PacketRunFailure:
      type: object
      required: [reason, packetSha256]
      properties:
        reason: { type: string }
        packetSha256: { type: string }
    PacketState:
      type: object
      description: >
        Portal-owned packet state machine — the staged C2 intake flow: preflight_running →
        gated → processing → report. Persisted server-side so the gate physically blocks;
        no client-side choreography can advance it. The spec §3 auto rule (<20 clean
        pages auto-proceed) is currently suspended: every packet gates so staff can
        pick the run's model plan before spend.
      required: [filename, sizeBytes, pages, sha256, uploadedAt, state]
      properties:
        filename: { type: string }
        sizeBytes: { type: integer }
        pages: { type: integer }
        sha256: { type: string }
        uploadedAt: { type: string }
        state:
          type: string
          enum: [preflight_running, gated, processing, report]
        preflight:
          $ref: "#/components/schemas/PacketPreflight"
        gate:
          $ref: "#/components/schemas/PacketGateDecision"
        lastRunError:
          type: string
          description: >
            Plain-language reason the last analyzer kick failed (packet reverted to gated).
            Cleared by the next successful upload, gate decision, or run ingest.
        uploaderIp:
          type: string
          description: audit trail — client IP the packet upload arrived from
        files:
          type: array
          description: >
            Multi-file provenance (assembled packets only): each source file's
            name and its [first,last] span in the packet's global page numbering.
            Absent on single-PDF uploads.
          items:
            type: object
            required: [filename, pages]
            properties:
              filename: { type: string }
              pages:
                type: array
                items: { type: integer }
                minItems: 2
                maxItems: 2
    PacketManifestFile:
      type: object
      required: [id, filename, sizeBytes, pages, flags, removed]
      properties:
        id: { type: string }
        filename: { type: string }
        sizeBytes: { type: integer }
        pages: { type: integer }
        flags:
          type: array
          description: deterministic per-file quality flags (same checks as pre-flight, no model calls)
          items: { type: string }
        removed: { type: boolean }
    PacketManifest:
      type: object
      description: >
        Multi-file intake staging (Phase 5 v1): the reviewable file list built before any
        analysis. Lives on the application until assemble replaces the packet; assembling
        marks it consumed. Removed files are simply skipped at assemble — no defer queue.
      required: [files, createdAt]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/PacketManifestFile"
        createdAt: { type: string }
        assembledAt:
          type: string
          description: set when assemble consumed this manifest (staging bytes are gone)
    AnalysisCoreFields:
      type: object
      description: >
        Universal core fields the judge emits per document (analyzer spec §1.4). Ungrounded
        in v1 — the verdict UI must display the dates for human confirmation at accept.
        Key names follow the analyzer contract verbatim.
      required: [document_date, primary_party_name]
      properties:
        document_date: { type: string }
        expiry_date: { type: string }
        primary_party_name: { type: string }
        issuing_party: { type: string }
    AnalysisSegment:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          description: "[firstPage, lastPage] within the source packet, 1-based inclusive."
          items: { type: integer }
          minItems: 2
          maxItems: 2
    AnalysisScores:
      type: object
      required: [quality, formatting, scrutinyTier]
      properties:
        quality: { type: number }
        formatting: { type: number }
        fraud_signal:
          type: number
          description: >
            Absent when the run's plan disabled fraud scoring (RunPlan.fraudScoring
            = false) — render "not scored this run", never assume 0.
        scrutinyTier:
          type: string
          enum: [critical, standard, supporting]
    AnalysisFlag:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
    AnalysisArtifacts:
      type: object
      description: URLs into the analyzer's artifact store (md + renders + crops).
      required: [md, pageRenders, crops]
      properties:
        judge:
          type: string
          description: >
            Audit-grade raw judge output for this document (judge/doc-<N>.json in
            the run's store folder) — the pre-mapping superset that every rendered
            score traces back to. Additive; absent on older runs.
        md: { type: string }
        pageRenders:
          type: array
          items: { type: string }
        crops:
          type: array
          items: { type: string }
    AnalysisDocument:
      type: object
      required: [segment, suggestedBlockId, confidence, suggestedName, coreFields, scores, flags, extractions, artifacts]
      properties:
        segment:
          $ref: "#/components/schemas/AnalysisSegment"
        suggestedBlockId:
          type: string
          description: Must resolve to a document block in the application's pinned template.
        confidence: { type: number }
        suggestedName:
          type: string
          description: Derived, never hand-written. Human rename always wins and is recorded.
        coreFields:
          $ref: "#/components/schemas/AnalysisCoreFields"
        scores:
          $ref: "#/components/schemas/AnalysisScores"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFlag"
        extractions:
          type: array
          description: Always present — empty in v1, populated in v2 with zero contract change.
          items:
            type: object
            additionalProperties: true
        artifacts:
          $ref: "#/components/schemas/AnalysisArtifacts"
    AnalysisUnassigned:
      type: object
      required: [pages, description]
      properties:
        pages:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        description: { type: string }
    AnalysisPreflight:
      type: object
      required: [pages, flags, gate]
      properties:
        pages: { type: integer }
        flags:
          type: array
          description: Plain-language pre-flight flags ("p.41–43 below 150 DPI").
          items: { type: string }
        gate:
          type: string
          enum: [auto, confirmed, bypassed]
    SatisfactionGroup:
      type: object
      description: one variant-shaped pile of run documents, as the pass read them
      required: [docPages]
      properties:
        variantId: { type: string, description: "declared variant this pile belongs to, when the pass could tell" }
        descriptorGuess:
          type: object
          description: descriptor values the pass read off the documents (keys = the block's descriptorFields)
          additionalProperties: { type: string }
        docPages:
          type: array
          description: "[first,last] of each run document in this pile"
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
        coverage: { type: string, description: "human sentence on sequence coverage (periods present, holes)" }
    BlockSatisfaction:
      type: object
      required: [groups, gaps, summary, generatedAt]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SatisfactionGroup"
        gaps:
          type: array
          description: what is still missing, one human sentence each (empty = nothing obvious)
          items: { type: string }
        summary: { type: string, description: "one paragraph — the expert read of where this requirement stands" }
        model: { type: string, description: "text model that produced this (provenance)" }
        generatedAt: { type: string }
    AnalysisRun:
      type: object
      required: [runId, startedAt, pipelineVersion, preflight, documents, unassigned, whisper]
      properties:
        runId: { type: string }
        startedAt: { type: string }
        pipelineVersion: { type: string }
        durationMs:
          type: integer
          description: >
            Total wall time of the run in ms (additive telemetry — the speed axis
            for engine comparisons). Per-stage timings live in the run store's
            config.json.
        artifactsProduced:
          type: object
          description: >
            Per-engine honesty — which artifact kinds THIS run actually produced
            (bare-VLM parses emit md only; Paddle/Mistral also emit elements).
            UI reads this instead of assuming capabilities.
          required: [md, elements, crops]
          properties:
            md: { type: boolean }
            elements: { type: boolean }
            crops: { type: boolean }
        fraudScoring:
          type: boolean
          description: >
            Echo of the resolved plan's fraud toggle. false = fraud_signal is
            absent on every document of THIS run ("not scored this run").
            Absent on older runs = scored.
        preflight:
          $ref: "#/components/schemas/AnalysisPreflight"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisDocument"
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisUnassigned"
        satisfaction:
          type: object
          description: >
            Satisfaction pass (Phase 4) — per SET block with ≥1 assigned
            document, a text-LLM read of how the run's documents map onto the
            block's declared variants and rules. Assistive only, never a gate;
            humans re-assign freely. Absent on runs before the pass existed or
            when no set block had documents.
          additionalProperties:
            $ref: "#/components/schemas/BlockSatisfaction"
        whisper:
          type: array
          items: { type: string }
    AnalysisSidecar:
      type: object
      description: Portal-owned sidecar file (data/analysis/<applicationId>.json). Append-only runs.
      required: [applicationId, latestRunId, runs]
      properties:
        applicationId: { type: string }
        latestRunId:
          oneOf:
            - type: string
            - type: "null"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRun"
